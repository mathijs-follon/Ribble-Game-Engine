name: CMake on multiple platforms

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations. Consider changing this to true when your workflow is stable.
      fail-fast: false

      # Set up a matrix to run the following configurations:
      # 1. <Windows, Release, latest MSVC compiler toolchain on the default runner image, default generator>
      # 2. <Linux, Release, latest GCC compiler toolchain on the default runner image, default generator>
      # 3. <Linux, Release, latest Clang compiler toolchain on the default runner image, default generator>
      #
      # To add more build types (Release, Debug, RelWithDebInfo, etc.) customize the build_type list.
      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Release]
        c_compiler: [gcc, clang, cl]
        include:
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
        exclude:
          - os: windows-latest
            c_compiler: gcc
          - os: windows-latest
            c_compiler: clang
          - os: ubuntu-latest
            c_compiler: cl

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libgl1-mesa-dev \
          libglu1-mesa-dev \
          libx11-dev \
          libxrandr-dev \
          libxinerama-dev \
          libxcursor-dev \
          libxi-dev \
          libvulkan-dev \
          vulkan-tools
        # Install libc++ for Clang to get better C++23 support (including std::expected)
        if [ "${{ matrix.c_compiler }}" == "clang" ]; then
          sudo apt-get install -y libc++-dev libc++abi-dev
        fi

    - name: Install Vulkan SDK (Windows)
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        $vulkanVersion = "1.3.280.0"
        $vulkanUrl = "https://sdk.lunarg.com/sdk/download/$vulkanVersion/windows/VulkanSDK-$vulkanVersion-Installer.exe"
        $installerPath = "$env:TEMP\VulkanSDK-Installer.exe"
        
        Write-Host "Downloading Vulkan SDK $vulkanVersion..."
        try {
          Invoke-WebRequest -Uri $vulkanUrl -OutFile $installerPath -ErrorAction Stop
        } catch {
          Write-Warning "Failed to download Vulkan SDK, trying alternative URL..."
          $vulkanUrl = "https://vulkan.lunarg.com/sdk/download/$vulkanVersion/windows/VulkanSDK-$vulkanVersion-Installer.exe"
          Invoke-WebRequest -Uri $vulkanUrl -OutFile $installerPath
        }
        
        Write-Host "Installing Vulkan SDK (silent mode)..."
        $process = Start-Process -FilePath $installerPath -ArgumentList "/S" -Wait -PassThru -NoNewWindow
        if ($process.ExitCode -ne 0) {
          Write-Warning "Vulkan SDK installer exited with code $($process.ExitCode)"
        }
        
        # Set environment variables for CMake to find Vulkan (persist across steps)
        $vulkanRoot = "${env:ProgramFiles}\VulkanSDK\$vulkanVersion"
        if (Test-Path $vulkanRoot) {
          Write-Host "Vulkan SDK installed at: $vulkanRoot"
          echo "VULKAN_SDK=$vulkanRoot" >> $env:GITHUB_ENV
          echo "$vulkanRoot\Bin" >> $env:GITHUB_PATH
        } else {
          # Try to find any installed version
          $vulkanBase = "${env:ProgramFiles}\VulkanSDK"
          if (Test-Path $vulkanBase) {
            $installedVersions = Get-ChildItem -Path $vulkanBase -Directory | Sort-Object Name -Descending
            if ($installedVersions.Count -gt 0) {
              $latestVersion = $installedVersions[0].FullName
              Write-Host "Found Vulkan SDK at: $latestVersion"
              echo "VULKAN_SDK=$latestVersion" >> $env:GITHUB_ENV
              echo "$latestVersion\Bin" >> $env:GITHUB_PATH
            } else {
              Write-Warning "Vulkan SDK installation may have failed, but continuing..."
            }
          } else {
            Write-Warning "Vulkan SDK not found, but continuing..."
          }
        }

    - name: Set reusable strings
      # Turn repeated input strings (such as the build output directory) into step outputs. These step outputs can be used throughout the workflow file.
      id: strings
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"
      shell: bash

    - name: Configure CMake (Linux)
      if: matrix.os == 'ubuntu-latest'
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      shell: bash
      run: |
        # Check compiler version for debugging
        echo "Compiler versions:"
        "${{ matrix.c_compiler }}" --version || true
        "${{ matrix.cpp_compiler }}" --version || true
        
        CMAKE_ARGS=(
          -B "${{ steps.strings.outputs.build-output-dir }}"
          -DCMAKE_CXX_COMPILER="${{ matrix.cpp_compiler }}"
          -DCMAKE_C_COMPILER="${{ matrix.c_compiler }}"
          -DCMAKE_BUILD_TYPE="${{ matrix.build_type }}"
          -DCMAKE_CXX_STANDARD=23
          -DCMAKE_CXX_STANDARD_REQUIRED=ON
          -DCMAKE_CXX_EXTENSIONS=OFF
          -S "${{ github.workspace }}"
        )
        # Use libc++ with Clang for better C++23 support (including std::expected)
        if [ "${{ matrix.c_compiler }}" == "clang" ]; then
          CMAKE_ARGS+=(-DCMAKE_CXX_FLAGS="-stdlib=libc++ -std=c++23")
          CMAKE_ARGS+=(-DCMAKE_EXE_LINKER_FLAGS="-stdlib=libc++ -lc++abi")
        else
          # For GCC, explicitly set C++23 flag to ensure it's used
          CMAKE_ARGS+=(-DCMAKE_CXX_FLAGS="-std=c++23")
        fi
        cmake "${CMAKE_ARGS[@]}"

    - name: Configure CMake (Windows)
      if: matrix.os == 'windows-latest'
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      shell: pwsh
      run: |
        cmake -B "${{ steps.strings.outputs.build-output-dir }}" `
          -DCMAKE_CXX_COMPILER="${{ matrix.cpp_compiler }}" `
          -DCMAKE_C_COMPILER="${{ matrix.c_compiler }}" `
          -DCMAKE_BUILD_TYPE="${{ matrix.build_type }}" `
          -DCMAKE_CXX_STANDARD=23 `
          -DCMAKE_CXX_STANDARD_REQUIRED=ON `
          -DCMAKE_CXX_EXTENSIONS=OFF `
          -S "${{ github.workspace }}"

    - name: Build
      # Build your program with the given configuration. Note that --config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

    - name: Test
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      # Execute tests defined by the CMake configuration. Note that --build-config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
      # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
      run: ctest --build-config ${{ matrix.build_type }} --output-on-failure

    - name: Find and Run Unit Tests
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      # Run the unit test executable directly to test the Ribble engine library
      shell: bash
      run: |
        if [ "${{ runner.os }}" == "Windows" ]; then
          TEST_EXE=$(find . -name "ribble_unit_tests.exe" -type f | head -n 1)
          if [ -n "$TEST_EXE" ]; then
            echo "Running: $TEST_EXE"
            "$TEST_EXE"
          else
            echo "Error: ribble_unit_tests.exe not found"
            exit 1
          fi
        else
          TEST_EXE=$(find . -name "ribble_unit_tests" -type f -executable | head -n 1)
          if [ -n "$TEST_EXE" ]; then
            echo "Running: $TEST_EXE"
            "$TEST_EXE"
          else
            echo "Error: ribble_unit_tests not found"
            exit 1
          fi
        fi

    - name: Find and Run Integration Tests
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      # Run the integration test executable directly to test the Ribble engine library
      shell: bash
      run: |
        if [ "${{ runner.os }}" == "Windows" ]; then
          TEST_EXE=$(find . -name "ribble_integration_tests.exe" -type f | head -n 1)
          if [ -n "$TEST_EXE" ]; then
            echo "Running: $TEST_EXE"
            "$TEST_EXE"
          else
            echo "Error: ribble_integration_tests.exe not found"
            exit 1
          fi
        else
          TEST_EXE=$(find . -name "ribble_integration_tests" -type f -executable | head -n 1)
          if [ -n "$TEST_EXE" ]; then
            echo "Running: $TEST_EXE"
            "$TEST_EXE"
          else
            echo "Error: ribble_integration_tests not found"
            exit 1
          fi
        fi

    - name: Find and Run Backend Tests
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      # Run the backend test executable directly to test the Ribble engine library
      shell: bash
      run: |
        if [ "${{ runner.os }}" == "Windows" ]; then
          TEST_EXE=$(find . -name "ribble_backend_tests.exe" -type f | head -n 1)
          if [ -n "$TEST_EXE" ]; then
            echo "Running: $TEST_EXE"
            "$TEST_EXE"
          else
            echo "Warning: ribble_backend_tests.exe not found, skipping..."
          fi
        else
          TEST_EXE=$(find . -name "ribble_backend_tests" -type f -executable | head -n 1)
          if [ -n "$TEST_EXE" ]; then
            echo "Running: $TEST_EXE"
            "$TEST_EXE"
          else
            echo "Warning: ribble_backend_tests not found, skipping..."
          fi
        fi
      continue-on-error: true

