name: CMake on multiple platforms

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations. Consider changing this to true when your workflow is stable.
      fail-fast: false

      # Set up a matrix to run the following configurations:
      # 1. <Windows, Release, latest MSVC compiler toolchain on the default runner image, default generator>
      # 2. <Linux, Release, latest GCC compiler toolchain on the default runner image, default generator>
      # 3. <Linux, Release, latest Clang compiler toolchain on the default runner image, default generator>
      #
      # To add more build types (Release, Debug, RelWithDebInfo, etc.) customize the build_type list.
      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Release]
        c_compiler: [gcc, clang, cl]
        include:
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
        exclude:
          - os: windows-latest
            c_compiler: gcc
          - os: windows-latest
            c_compiler: clang
          - os: ubuntu-latest
            c_compiler: cl

    steps:
    - uses: actions/checkout@v4

    - name: Cache CMake dependencies
      uses: actions/cache@v4
      id: cache-cmake-deps
      with:
        path: |
          ${{ github.workspace }}/build/_deps
        key: ${{ runner.os }}-${{ matrix.c_compiler }}-cmake-deps-${{ hashFiles('CMakeLists.txt') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.c_compiler }}-cmake-deps-
          ${{ runner.os }}-cmake-deps-

    - name: Cache system packages (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      uses: actions/cache@v4
      with:
        path: |
          /var/cache/apt
          /var/lib/apt
        key: ${{ runner.os }}-apt-${{ matrix.c_compiler }}-${{ hashFiles('.github/workflows/cmake-multi-platform.yml') }}
        restore-keys: |
          ${{ runner.os }}-apt-${{ matrix.c_compiler }}-
          ${{ runner.os }}-apt-

    - name: Cache Vulkan SDK (Windows)
      if: matrix.os == 'windows-latest'
      uses: actions/cache@v4
      id: cache-vulkan
      with:
        path: |
          C:\Program Files\VulkanSDK
        key: ${{ runner.os }}-vulkan-sdk-1.3.280.0
        restore-keys: |
          ${{ runner.os }}-vulkan-sdk-

    - name: Install dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        # Update package lists (use cache if available)
        sudo apt-get update
        
        # Install system dependencies
        sudo apt-get install -y --no-install-recommends \
          libgl1-mesa-dev \
          libglu1-mesa-dev \
          libx11-dev \
          libxrandr-dev \
          libxinerama-dev \
          libxcursor-dev \
          libxi-dev \
          libvulkan-dev \
          vulkan-tools
        
        # Install newer compilers that support std::expected
        if [ "${{ matrix.c_compiler }}" == "gcc" ]; then
          # Install GCC 14 which has better C++23 and std::expected support
          # Try GCC 14 first, fall back to GCC 13 if not available
          if sudo apt-get install -y gcc-14 g++-14 2>/dev/null; then
            echo "Installed GCC 14"
          else
            echo "GCC 14 not available, trying GCC 13..."
            sudo apt-get install -y gcc-13 g++-13
          fi
        elif [ "${{ matrix.c_compiler }}" == "clang" ]; then
          # Install Clang 18+ and libc++ for better C++23 support (including std::expected)
          # Try Clang 18 first, fall back to Clang 17 if not available
          if sudo apt-get install -y clang-18 libc++-18-dev libc++abi-18-dev 2>/dev/null; then
            echo "Installed Clang 18"
          else
            echo "Clang 18 not available, trying Clang 17..."
            sudo apt-get install -y clang-17 libc++-17-dev libc++abi-17-dev || \
            sudo apt-get install -y clang-16 libc++-16-dev libc++abi-16-dev || \
            sudo apt-get install -y libc++-dev libc++abi-dev
          fi
        fi

    - name: Install Vulkan SDK (Windows)
      if: matrix.os == 'windows-latest'
      shell: pwsh
      timeout-minutes: 1
      run: |
        # Check if Vulkan SDK is already installed (from cache or previous installation)
        $vulkanBase = "C:\Program Files\VulkanSDK"
        if (Test-Path $vulkanBase) {
          $installedVersions = Get-ChildItem -Path $vulkanBase -Directory | Sort-Object Name -Descending
          if ($installedVersions.Count -gt 0) {
            $latestVersion = $installedVersions[0].FullName
            Write-Host "Found existing Vulkan SDK at: $latestVersion (from cache or previous installation)"
            echo "VULKAN_SDK=$latestVersion" >> $env:GITHUB_ENV
            echo "$latestVersion\Bin" >> $env:GITHUB_PATH
            exit 0
          }
        }
        
        # Check cache hit status
        if ("${{ steps.cache-vulkan.outputs.cache-hit }}" -eq "true") {
          Write-Host "Vulkan SDK restored from cache"
          if (Test-Path $vulkanBase) {
            $installedVersions = Get-ChildItem -Path $vulkanBase -Directory | Sort-Object Name -Descending
            if ($installedVersions.Count -gt 0) {
              $latestVersion = $installedVersions[0].FullName
              echo "VULKAN_SDK=$latestVersion" >> $env:GITHUB_ENV
              echo "$latestVersion\Bin" >> $env:GITHUB_PATH
              exit 0
            }
          }
        }
        
        # Try to install Vulkan SDK with timeout
        $vulkanVersion = "1.3.280.0"
        $vulkanUrl = "https://sdk.lunarg.com/sdk/download/$vulkanVersion/windows/VulkanSDK-$vulkanVersion-Installer.exe"
        $installerPath = "$env:TEMP\VulkanSDK-Installer.exe"
        
        Write-Host "Downloading Vulkan SDK $vulkanVersion..."
        try {
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri $vulkanUrl -OutFile $installerPath -ErrorAction Stop -TimeoutSec 30
        } catch {
          Write-Warning "Failed to download Vulkan SDK: $_"
          Write-Host "Skipping Vulkan SDK installation - Vulkan backend will be disabled"
          echo "VULKAN_SDK=" >> $env:GITHUB_ENV
          exit 0
        }
        
        Write-Host "Installing Vulkan SDK (silent mode with timeout)..."
        $job = Start-Job -ScriptBlock {
          param($installerPath)
          $process = Start-Process -FilePath $installerPath -ArgumentList "/S" -Wait -PassThru -NoNewWindow
          return $process.ExitCode
        } -ArgumentList $installerPath
        
        # Wait for installation with timeout (0.5 minutes)
        $result = Wait-Job -Job $job -Timeout 30
        if ($result) {
          $exitCode = Receive-Job -Job $job
          Remove-Job -Job $job
          if ($exitCode -ne 0) {
            Write-Warning "Vulkan SDK installer exited with code $exitCode"
          }
        } else {
          Write-Warning "Vulkan SDK installation timed out after 5 minutes"
          Stop-Job -Job $job
          Remove-Job -Job $job
        }
        
        # Set environment variables for CMake to find Vulkan (persist across steps)
        $vulkanRoot = "C:\Program Files\VulkanSDK\$vulkanVersion"
        if (Test-Path $vulkanRoot) {
          Write-Host "Vulkan SDK installed at: $vulkanRoot"
          echo "VULKAN_SDK=$vulkanRoot" >> $env:GITHUB_ENV
          echo "$vulkanRoot\Bin" >> $env:GITHUB_PATH
        } else {
          # Try to find any installed version
          if (Test-Path $vulkanBase) {
            $installedVersions = Get-ChildItem -Path $vulkanBase -Directory | Sort-Object Name -Descending
            if ($installedVersions.Count -gt 0) {
              $latestVersion = $installedVersions[0].FullName
              Write-Host "Found Vulkan SDK at: $latestVersion"
              echo "VULKAN_SDK=$latestVersion" >> $env:GITHUB_ENV
              echo "$latestVersion\Bin" >> $env:GITHUB_PATH
            } else {
              Write-Warning "Vulkan SDK installation may have failed, but continuing..."
              echo "VULKAN_SDK=" >> $env:GITHUB_ENV
            }
          } else {
            Write-Warning "Vulkan SDK not found, but continuing..."
            echo "VULKAN_SDK=" >> $env:GITHUB_ENV
          }
        }

    - name: Set reusable strings
      # Turn repeated input strings (such as the build output directory) into step outputs. These step outputs can be used throughout the workflow file.
      id: strings
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"
      shell: bash

    - name: Configure CMake (Linux)
      if: matrix.os == 'ubuntu-latest'
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      shell: bash
      run: |
        # Determine compiler paths based on version (try newer versions first)
        if [ "${{ matrix.c_compiler }}" == "gcc" ]; then
          if command -v gcc-14 &> /dev/null; then
            C_COMPILER="gcc-14"
            CXX_COMPILER="g++-14"
          elif command -v gcc-13 &> /dev/null; then
            C_COMPILER="gcc-13"
            CXX_COMPILER="g++-13"
          else
            C_COMPILER="gcc"
            CXX_COMPILER="g++"
          fi
        elif [ "${{ matrix.c_compiler }}" == "clang" ]; then
          if command -v clang-18 &> /dev/null; then
            C_COMPILER="clang-18"
            CXX_COMPILER="clang++-18"
          elif command -v clang-17 &> /dev/null; then
            C_COMPILER="clang-17"
            CXX_COMPILER="clang++-17"
          elif command -v clang-16 &> /dev/null; then
            C_COMPILER="clang-16"
            CXX_COMPILER="clang++-16"
          else
            C_COMPILER="clang"
            CXX_COMPILER="clang++"
          fi
        else
          C_COMPILER="${{ matrix.c_compiler }}"
          CXX_COMPILER="${{ matrix.cpp_compiler }}"
        fi
        
        # Check compiler version for debugging
        echo "Compiler versions:"
        $C_COMPILER --version || true
        $CXX_COMPILER --version || true
        
        CMAKE_ARGS=(
          -B "${{ steps.strings.outputs.build-output-dir }}"
          -DCMAKE_CXX_COMPILER="$CXX_COMPILER"
          -DCMAKE_C_COMPILER="$C_COMPILER"
          -DCMAKE_BUILD_TYPE="${{ matrix.build_type }}"
          -DCMAKE_CXX_STANDARD=23
          -DCMAKE_CXX_STANDARD_REQUIRED=ON
          -DCMAKE_CXX_EXTENSIONS=OFF
          -S "${{ github.workspace }}"
        )
        # Use libc++ with Clang for better C++23 support (including std::expected)
        if [ "${{ matrix.c_compiler }}" == "clang" ]; then
          CMAKE_ARGS+=(-DCMAKE_CXX_FLAGS="-stdlib=libc++ -std=c++23")
          CMAKE_ARGS+=(-DCMAKE_EXE_LINKER_FLAGS="-stdlib=libc++ -lc++abi")
        else
          # For GCC 14, explicitly set C++23 flag
          CMAKE_ARGS+=(-DCMAKE_CXX_FLAGS="-std=c++23")
        fi
        cmake "${CMAKE_ARGS[@]}"

    - name: Configure CMake (Windows)
      if: matrix.os == 'windows-latest'
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      shell: pwsh
      run: |
        $cmakeArgs = @(
          "-B", "${{ steps.strings.outputs.build-output-dir }}"
          "-DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}"
          "-DCMAKE_C_COMPILER=${{ matrix.c_compiler }}"
          "-DCMAKE_BUILD_TYPE=${{ matrix.build_type }}"
          "-DCMAKE_CXX_STANDARD=23"
          "-DCMAKE_CXX_STANDARD_REQUIRED=ON"
          "-DCMAKE_CXX_EXTENSIONS=OFF"
          "-S", "${{ github.workspace }}"
        )
        
        # If Vulkan SDK is not set, make Vulkan backend optional
        if (-not $env:VULKAN_SDK) {
          Write-Host "Vulkan SDK not found - Vulkan backend will be optional"
          $cmakeArgs += "-DRIBBLE_VULKAN_OPTIONAL=ON"
        }
        
        cmake $cmakeArgs

    - name: Build
      # Build your program with the given configuration. Note that --config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
      shell: pwsh
      run: |
        $buildDir = "${{ steps.strings.outputs.build-output-dir }}"
        $config = "${{ matrix.build_type }}"
        
        Write-Host "Building with configuration: $config"
        Write-Host "Build directory: $buildDir"
        
        # Build with verbose output to see errors
        $buildResult = cmake --build $buildDir --config $config --verbose 2>&1
        $exitCode = $LASTEXITCODE
        
        # Output the build result
        Write-Host $buildResult
        
        if ($exitCode -ne 0) {
          Write-Host "Build failed with exit code: $exitCode"
          Write-Host "Checking for error logs..."
          # Try to find error details
          Get-ChildItem -Path $buildDir -Recurse -Filter "*.log" -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "Log file: $($_.FullName)"
            Get-Content $_.FullName -Tail 50 -ErrorAction SilentlyContinue
          }
          exit $exitCode
        }

    - name: Test
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      # Execute tests defined by the CMake configuration. Note that --build-config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
      # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
      run: ctest --build-config ${{ matrix.build_type }} --output-on-failure

    - name: Find and Run Unit Tests
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      # Run the unit test executable directly to test the Ribble engine library
      shell: bash
      run: |
        if [ "${{ runner.os }}" == "Windows" ]; then
          TEST_EXE=$(find . -name "ribble_unit_tests.exe" -type f | head -n 1)
          if [ -n "$TEST_EXE" ]; then
            echo "Running: $TEST_EXE"
            "$TEST_EXE"
          else
            echo "Error: ribble_unit_tests.exe not found"
            exit 1
          fi
        else
          TEST_EXE=$(find . -name "ribble_unit_tests" -type f -executable | head -n 1)
          if [ -n "$TEST_EXE" ]; then
            echo "Running: $TEST_EXE"
            "$TEST_EXE"
          else
            echo "Error: ribble_unit_tests not found"
            exit 1
          fi
        fi

    - name: Find and Run Integration Tests
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      # Run the integration test executable directly to test the Ribble engine library
      shell: bash
      run: |
        if [ "${{ runner.os }}" == "Windows" ]; then
          TEST_EXE=$(find . -name "ribble_integration_tests.exe" -type f | head -n 1)
          if [ -n "$TEST_EXE" ]; then
            echo "Running: $TEST_EXE"
            "$TEST_EXE"
          else
            echo "Error: ribble_integration_tests.exe not found"
            exit 1
          fi
        else
          TEST_EXE=$(find . -name "ribble_integration_tests" -type f -executable | head -n 1)
          if [ -n "$TEST_EXE" ]; then
            echo "Running: $TEST_EXE"
            "$TEST_EXE"
          else
            echo "Error: ribble_integration_tests not found"
            exit 1
          fi
        fi

    - name: Find and Run Backend Tests
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      # Run the backend test executable directly to test the Ribble engine library
      shell: bash
      run: |
        if [ "${{ runner.os }}" == "Windows" ]; then
          TEST_EXE=$(find . -name "ribble_backend_tests.exe" -type f | head -n 1)
          if [ -n "$TEST_EXE" ]; then
            echo "Running: $TEST_EXE"
            "$TEST_EXE"
          else
            echo "Warning: ribble_backend_tests.exe not found, skipping..."
          fi
        else
          TEST_EXE=$(find . -name "ribble_backend_tests" -type f -executable | head -n 1)
          if [ -n "$TEST_EXE" ]; then
            echo "Running: $TEST_EXE"
            "$TEST_EXE"
          else
            echo "Warning: ribble_backend_tests not found, skipping..."
          fi
        fi
      continue-on-error: true

